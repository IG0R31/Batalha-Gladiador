<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batalha de Gladiadores - Pesquisa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { min-height: 100vh; background: #cdedb3; }
        .titulo-pesquisa{
            font-family: "EB Garamond", Garamond, serif;
            font-weight: 700;
        }
        .card-img-top{ height: 220px; object-fit: contain; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container-fluid">
    <a class="navbar-brand" th:href="@{/principal}">BATALHA DE GLADIADORES</a>
  </div>
</nav>

<div class="container py-4">
    <h1 class="titulo-pesquisa mb-3">Resultados para "<span th:text="${termo}">termo</span>"</h1>
    <div class="alert alert-danger py-2" th:if="${erro}" th:text="${erro}"></div>
    <p class="text-body-secondary" th:if="${resultados != null and #lists.isEmpty(resultados)}">
        Nenhum gladiador encontrado.
    </p>

    <div class="row row-cols-1 row-cols-md-3 g-4">
        <div class="col" th:each="g : ${resultados}">
            <div class="card h-100">
                <img th:src="${@batalha_gladiadorController.imagemDe(g.aparencia)}" class="card-img-top" alt="Gladiador">
                <div class="card-body">
                    <h5 class="card-title" th:text="${g.nome}">Nome</h5>
                    <p class="card-text" th:text="${g.descricao}">Descrição</p>
                    <span class="badge text-bg-warning" th:text="${g.tier}">BRONZE</span>
                    <span class="badge" th:classappend="${g.status == 'VIVO'} ? 'text-bg-success' : 'text-bg-danger'" th:text="${g.status}">VIVO</span>
                </div>
                <div class="card-footer d-flex justify-content-between">
                    <small class="text-body-secondary">Batalhas vencidas: <span th:text="${g.batalhasVencidas}">0</span></small>
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/gladiador/{id}(id=${g.id})}">Ver</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
