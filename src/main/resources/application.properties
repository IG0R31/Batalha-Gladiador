# Conexão com o MySQL (batalha_gladiador) — ajuste usuário/senha do seu banco local
spring.datasource.url=jdbc:mysql://localhost:3306/batalha_gladiador
spring.datasource.username=root
spring.datasource.password=TROQUE_A_SENHA

# O banco é criado pelo seu script SQL; o Hibernate não altera o schema
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Templates recarregam ao vivo (com devtools)
spring.thymeleaf.cache=false